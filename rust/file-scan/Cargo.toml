[package]
name = "file-scan"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cxx = "=1.0.202"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"
parquet = { version = "=59.3.0", default-features = false, features = ["snap"] }

[dev-dependencies]
tempfile = "3"
